<!DOCTYPE html>
<html lang="pt-br">

<head>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mySimple Panel - Inicio</title>
    <link rel="stylesheet" href="/frontend/css/style.css">
</head>

<body class="mainpages">

    <div id="customAlert" class="alert-box">
        <p id="alertMessage"></p>
        <button class="btnMain" onclick="closeAlert()">Ok</button>
    </div>
    <div class="page">
        <img class="logo" src="./assets/logo.png" alt="mySimple Panel">
        <div class="infoCredentials">
            <form>
                <h2>Esqueci minha senha</h2>
                <label for="e-mail">Digite seu e-mail:</label>
                <input type="text" placeholder="Digite seu e-mail" id="email"></input>
                <button class="btnMain" id="btn" type="button" disabled>Confirmar</button>
            </form>
        </div>
        <footer>© Copyright, todos os direitos reservados, 2025</footer>
    </div>

    <script type="module" src="/frontend/js/pages/forgotData.js" defer></script>
</body>

</html>
